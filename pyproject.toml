[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orchestrator-kernel"
version = "0.1.0"
description = "Orchestrator Kernel MVP — multi-agent coordination brain (spec 001-orchestrator-kernel)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "hjx" }]
keywords = ["agent", "orchestrator", "multi-agent", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anyio>=4",
    "structlog>=24",
    "typer>=0.12",
    "psutil>=5.9",
    "jsonschema>=4.21",
    "ulid-py>=1.1",
]

[project.scripts]
orchestrator-kernel = "orchestrator_kernel.cli_main:app"

[tool.hatch.build.targets.wheel]
# `workers_stub` is a dev-only test fixture (see research.md Decision 11) and
# MUST NOT ship in the distribution wheel — one of its stubs deliberately OOMs.
# Keep it under `src/` for pythonpath/editable convenience, but exclude from dist.
packages = ["src/orchestrator_kernel"]

# Dev dependencies live ONLY here (PEP 735). `uv sync` reads this group natively.
# Pure-pip users (pip ≥ 25): `pip install --group dev .`
# Older pip: `pip install pytest pytest-asyncio hypothesis ruff mypy` manually.
# Do NOT mirror this list back into `[project.optional-dependencies].dev` — that
# would create two sources of truth and silent drift (see Review finding H2).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psutil.*", "ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hypothesis]
deadline = 2000
